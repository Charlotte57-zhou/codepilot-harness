<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>飞机大战</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  .game-wrapper {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .game-header {
    display: flex;
    justify-content: space-between;
    width: 480px;
    padding: 8px 16px;
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    user-select: none;
  }
  .game-header .score { color: #ffd700; }
  .game-header .lives { color: #ff4444; }
  canvas {
    display: block;
    border: 2px solid #334;
    border-radius: 4px;
    background: #0d0d2b;
  }
  .overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    pointer-events: none;
    opacity: 0;
    visibility: hidden;
    transform: translateY(6px);
    transition: opacity 180ms ease, transform 180ms ease, visibility 0s linear 180ms;
  }
  .overlay.active {
    pointer-events: auto;
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
    transition: opacity 180ms ease, transform 180ms ease;
  }
  .overlay h1 {
    font-size: 42px;
    color: #fff;
    text-shadow: 0 0 20px rgba(100,180,255,0.8);
    margin-bottom: 12px;
    letter-spacing: 4px;
  }
  .overlay .subtitle {
    font-size: 14px;
    color: #aac;
    margin-bottom: 30px;
  }
  .overlay .final-score {
    font-size: 24px;
    color: #ffd700;
    margin-bottom: 24px;
  }
  .btn {
    padding: 12px 48px;
    font-size: 20px;
    font-weight: bold;
    color: #fff;
    background: linear-gradient(135deg, #2266cc, #3388ff);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    letter-spacing: 2px;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 16px rgba(50,120,255,0.4);
  }
  .btn:hover {
    transform: scale(1.06);
    box-shadow: 0 6px 24px rgba(50,140,255,0.6);
  }
  .btn:active { transform: scale(0.96); }
  .hint {
    margin-top: 20px;
    font-size: 13px;
    color: #778;
  }
</style>
</head>
<body>
<div class="game-wrapper">
  <div class="game-header">
    <span>💥 得分: <span class="score" id="scoreDisplay">0</span></span>
    <span>❤️ 生命: <span class="lives" id="livesDisplay">3</span></span>
  </div>
  <div style="position:relative;">
    <canvas id="gameCanvas" width="480" height="640"></canvas>

    <!-- 开始界面遮罩 -->
    <div class="overlay active" id="startOverlay">
      <h1>✈️ 飞机大战</h1>
      <p class="subtitle">消灭敌机 · 勇夺高分</p>
      <button class="btn" id="startBtn">开 始 游 戏</button>
      <p class="hint">方向键 / WASD 移动 · 自动射击</p>
    </div>

    <!-- 结束界面遮罩 -->
    <div class="overlay" id="endOverlay">
      <h1>💥 游戏结束</h1>
      <p class="final-score" id="finalScore">得分: 0</p>
      <button class="btn" id="restartBtn">重 新 开 始</button>
    </div>
  </div>
</div>

<script>
(function() {
  // ===== DOM 元素 =====
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const livesDisplay = document.getElementById('livesDisplay');
  const startOverlay = document.getElementById('startOverlay');
  const endOverlay = document.getElementById('endOverlay');
  const finalScore = document.getElementById('finalScore');

  const W = canvas.width;   // 480
  const H = canvas.height;  // 640

  // ===== 游戏状态 =====
  const STATE = { IDLE: 'idle', PLAYING: 'playing', OVER: 'over' };
  let gameState = STATE.IDLE;

  // ===== 游戏数据 =====
  let score = 0;
  let lives = 3;
  let player = null;
  let bullets = [];
  let enemies = [];
  let stars = [];

  // ===== 键盘 =====
  const keys = {};

  // ===== 定时器 =====
  let shootTimer = 0;
  let spawnTimer = 0;
  let invincibleTimer = 0;

  // ===== 难度递增 =====
  let spawnInterval = 900;    // 敌机生成间隔 (ms)
  let enemySpeedBase = 2.0;   // 敌机基础速度

  // ===== 辅助：随机数 =====
  function rand(min, max) { return Math.random() * (max - min) + min; }
  function randInt(min, max) { return Math.floor(rand(min, max + 1)); }

  // ===== 初始化玩家 =====
  function createPlayer() {
    return {
      x: W / 2,
      y: H - 80,
      w: 40,
      h: 48,
      speed: 5
    };
  }

  // ===== 绘制函数 =====
  function drawPlayer() {
    if (!player) return;
    // 无敌闪烁效果
    if (invincibleTimer > 0 && Math.floor(invincibleTimer / 80) % 2 === 0) return;

    const cx = player.x;
    const cy = player.y;
    ctx.save();
    ctx.translate(cx, cy);

    // 引擎火焰
    const flameLen = 12 + Math.random() * 8;
    ctx.fillStyle = '#ff6600';
    ctx.beginPath();
    ctx.moveTo(-8, 22);
    ctx.lineTo(0, 22 + flameLen);
    ctx.lineTo(8, 22);
    ctx.fill();
    ctx.fillStyle = '#ffcc00';
    ctx.beginPath();
    ctx.moveTo(-4, 22);
    ctx.lineTo(0, 22 + flameLen * 0.65);
    ctx.lineTo(4, 22);
    ctx.fill();

    // 机身
    ctx.fillStyle = '#3399ff';
    ctx.beginPath();
    ctx.moveTo(0, -24);
    ctx.lineTo(-16, 14);
    ctx.lineTo(-6, 22);
    ctx.lineTo(0, 18);
    ctx.lineTo(6, 22);
    ctx.lineTo(16, 14);
    ctx.closePath();
    ctx.fill();

    // 驾驶舱
    ctx.fillStyle = '#aaddff';
    ctx.beginPath();
    ctx.ellipse(0, -6, 6, 10, 0, 0, Math.PI * 2);
    ctx.fill();

    // 机翼高亮
    ctx.strokeStyle = '#66bbff';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, -24);
    ctx.lineTo(-16, 14);
    ctx.moveTo(0, -24);
    ctx.lineTo(16, 14);
    ctx.stroke();

    ctx.restore();
  }

  function drawBullet(b) {
    ctx.fillStyle = '#ffee44';
    ctx.shadowColor = '#ffaa00';
    ctx.shadowBlur = 6;
    ctx.fillRect(b.x - 2, b.y - 6, 4, 12);
    ctx.shadowBlur = 0;
  }

  function drawEnemy(e) {
    const cx = e.x;
    const cy = e.y;
    ctx.save();
    ctx.translate(cx, cy);

    // 敌机机身（倒三角）
    ctx.fillStyle = '#ff3344';
    ctx.beginPath();
    ctx.moveTo(0, 18);
    ctx.lineTo(-14, -10);
    ctx.lineTo(-5, -4);
    ctx.lineTo(5, -4);
    ctx.lineTo(14, -10);
    ctx.closePath();
    ctx.fill();

    // 敌机标志
    ctx.fillStyle = '#ff8899';
    ctx.beginPath();
    ctx.arc(0, 4, 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawStar(s) {
    ctx.fillStyle = s.color;
    ctx.globalAlpha = s.alpha;
    ctx.fillRect(s.x, s.y, s.size, s.size);
    ctx.globalAlpha = 1;
  }

  // ===== 创建子弹 =====
  function spawnBullet() {
    bullets.push({
      x: player.x,
      y: player.y - 24,
      w: 4,
      h: 12,
      speed: 7
    });
  }

  // ===== 创建敌机 =====
  function spawnEnemy() {
    const size = randInt(28, 44);
    enemies.push({
      x: rand(size, W - size),
      y: -size,
      w: size * 0.75,
      h: size,
      speed: rand(enemySpeedBase, enemySpeedBase + 2.0)
    });
  }

  // ===== 初始化背景星星 =====
  function initStars() {
    stars = [];
    for (let i = 0; i < 60; i++) {
      stars.push({
        x: rand(0, W),
        y: rand(0, H),
        size: rand(1, 3),
        speed: rand(0.3, 1.5),
        alpha: rand(0.3, 0.9),
        color: ['#fff', '#aaccff', '#ffccaa'][randInt(0, 2)]
      });
    }
  }

  // ===== 重置游戏数据 =====
  function resetGame() {
    score = 0;
    lives = 3;
    player = createPlayer();
    bullets = [];
    enemies = [];
    shootTimer = 0;
    spawnTimer = 0;
    invincibleTimer = 0;
    spawnInterval = 900;
    enemySpeedBase = 2.0;
    updateUI();
  }

  // ===== 更新 UI =====
  function updateUI() {
    scoreDisplay.textContent = score;
    livesDisplay.textContent = lives;
  }

  // ===== AABB 碰撞检测 =====
  function rectCollide(a, b) {
    return (
      a.x - a.w / 2 < b.x + b.w / 2 &&
      a.x + a.w / 2 > b.x - b.w / 2 &&
      a.y - a.h / 2 < b.y + b.h / 2 &&
      a.y + a.h / 2 > b.y - b.h / 2
    );
  }

  // ===== 开始游戏 =====
  function startGame() {
    resetGame();
    gameState = STATE.PLAYING;
    startOverlay.classList.remove('active');
    endOverlay.classList.remove('active');
  }

  // ===== 结束游戏 =====
  function endGame() {
    gameState = STATE.OVER;
    finalScore.textContent = '最终得分: ' + score;
    endOverlay.classList.add('active');
  }

  // ===== 玩家受伤 =====
  function playerHit() {
    if (invincibleTimer > 0) return; // 无敌中
    lives--;
    updateUI();
    if (lives <= 0) {
      endGame();
    } else {
      invincibleTimer = 2000; // 2秒无敌
    }
  }

  // ===== 游戏主循环 =====
  let lastTime = 0;
  function gameLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    let dt = timestamp - lastTime;
    lastTime = timestamp;

    // 防止切 tab 后 dt 巨大
    if (dt > 200) dt = 16;

    update(dt);
    render();
    requestAnimationFrame(gameLoop);
  }

  // ===== 更新逻辑 =====
  function update(dt) {
    // 背景星星始终滚动
    updateStars(dt);

    if (gameState !== STATE.PLAYING) return;

    // 无敌计时
    if (invincibleTimer > 0) invincibleTimer -= dt;

    // 玩家移动
    updatePlayer();

    // 自动射击
    shootTimer += dt;
    if (shootTimer >= 180) {
      shootTimer -= 180;
      spawnBullet();
    }

    // 敌机生成
    spawnTimer += dt;
    if (spawnTimer >= spawnInterval) {
      spawnTimer -= spawnInterval;
      spawnEnemy();
      // 难度递增
      if (spawnInterval > 400) spawnInterval -= 5;
      if (enemySpeedBase < 5) enemySpeedBase += 0.02;
    }

    // 子弹移动
    for (let i = bullets.length - 1; i >= 0; i--) {
      bullets[i].y -= bullets[i].speed;
      if (bullets[i].y < -20) {
        bullets.splice(i, 1);
      }
    }

    // 敌机移动
    for (let i = enemies.length - 1; i >= 0; i--) {
      enemies[i].y += enemies[i].speed;
      if (enemies[i].y > H + 60) {
        enemies.splice(i, 1);
      }
    }

    // 碰撞检测：子弹 vs 敌机
    for (let bi = bullets.length - 1; bi >= 0; bi--) {
      let hit = false;
      for (let ei = enemies.length - 1; ei >= 0; ei--) {
        if (rectCollide(bullets[bi], enemies[ei])) {
          // 命中特效（可选：这里简单处理）
          enemies.splice(ei, 1);
          hit = true;
          score += 10;
          updateUI();
          break;
        }
      }
      if (hit) {
        bullets.splice(bi, 1);
      }
    }

    // 碰撞检测：玩家 vs 敌机
    if (player && invincibleTimer <= 0) {
      for (let ei = enemies.length - 1; ei >= 0; ei--) {
        if (rectCollide(player, enemies[ei])) {
          enemies.splice(ei, 1);
          playerHit();
          if (gameState === STATE.OVER) return;
          break;
        }
      }
    }
  }

  // ===== 更新玩家位置 =====
  function updatePlayer() {
    if (!player) return;
    let dx = 0, dy = 0;
    if (keys['ArrowLeft'] || keys['KeyA'])  dx = -1;
    if (keys['ArrowRight'] || keys['KeyD']) dx = 1;
    if (keys['ArrowUp'] || keys['KeyW'])    dy = -1;
    if (keys['ArrowDown'] || keys['KeyS'])  dy = 1;

    // 归一化对角线速度
    if (dx !== 0 && dy !== 0) {
      dx *= 0.707;
      dy *= 0.707;
    }

    player.x += dx * player.speed;
    player.y += dy * player.speed;

    // 边界限制
    if (player.x < player.w / 2) player.x = player.w / 2;
    if (player.x > W - player.w / 2) player.x = W - player.w / 2;
    if (player.y < player.h / 2) player.y = player.h / 2;
    if (player.y > H - player.h / 2) player.y = H - player.h / 2;
  }

  // ===== 更新背景星星 =====
  function updateStars(dt) {
    for (let s of stars) {
      s.y += s.speed * (dt / 16);
      if (s.y > H + 4) {
        s.y = -4;
        s.x = rand(0, W);
      }
    }
  }

  // ===== 渲染 =====
  function render() {
    // 清屏
    ctx.fillStyle = '#0d0d2b';
    ctx.fillRect(0, 0, W, H);

    // 绘制星星
    for (let s of stars) drawStar(s);

    if (gameState === STATE.IDLE) {
      // 空闲状态：画几颗装饰星星
      return;
    }

    // 绘制子弹
    for (let b of bullets) drawBullet(b);

    // 绘制敌机
    for (let e of enemies) drawEnemy(e);

    // 绘制玩家
    drawPlayer();
  }

  // ===== 键盘事件 =====
  window.addEventListener('keydown', function(e) {
    keys[e.code] = true;
    // 防止方向键滚动页面
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) {
      e.preventDefault();
    }
  });

  window.addEventListener('keyup', function(e) {
    keys[e.code] = false;
  });

  // ===== 按钮事件 =====
  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('restartBtn').addEventListener('click', startGame);

  // ===== 启动 =====
  initStars();
  requestAnimationFrame(gameLoop);
})();
</script>
</body>
</html>
