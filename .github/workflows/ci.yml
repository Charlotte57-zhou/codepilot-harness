name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:context
      - run: npm run check:privacy
      - run: npm audit --audit-level=high
      - run: npm run export:public -- --output "${{ runner.temp }}\\codepilot-public"
      - run: npm run verify:public -- --input "${{ runner.temp }}\\codepilot-public"
